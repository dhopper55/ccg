<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" sizes="180x180" href="../images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon/favicon-16x16.png">
  <link rel="shortcut icon" href="../images/favicon/favicon.ico">
  <title>Inventory Manager | Coal Creek Guitars</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="manifest" href="../admin.webmanifest">
  <meta name="theme-color" content="#18150f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CCG Admin">
  <link rel="stylesheet" href="../styles.css?version=555823">
</head>
<body>
  <nav class="site-nav">
    <a href="../index.html" class="nav-logo">
      <img src="../images/coal-creek-logo.png" alt="Coal Creek Guitars">
    </a>
    <a href="index.html" class="nav-home">Admin</a>
  </nav>

  <div class="container listing-evaluator inventory-manager">
    <header class="listing-hero">
      <div class="listing-hero-row">
        <h1>Inventory Manager</h1>
        <div class="listing-results-actions">
          <a class="button-link success icon-only" href="inventory-item.html" aria-label="Add Inventory Item" title="Add Inventory Item">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img" focusable="false" aria-hidden="true">
                <path d="M11 5h2v14h-2zM5 11h14v2H5z" fill="currentColor"></path>
              </svg>
            </span>
          </a>
        </div>
      </div>
    </header>

    <section class="listing-section">
      <div class="inventory-grid-toolbar listing-results-controls">
        <div class="inventory-grid-filter">
          <label for="inventory-filter-category">Category</label>
          <select id="inventory-filter-category" aria-label="Filter by category">
            <option value="" selected></option>
          </select>
        </div>
        <div class="inventory-grid-filter">
          <label for="inventory-filter-brand">Brand</label>
          <select id="inventory-filter-brand" aria-label="Filter by brand">
            <option value="" selected></option>
          </select>
        </div>
        <label class="toggle" for="inventory-filter-sold">
          <input type="checkbox" id="inventory-filter-sold">
          <span>Sold</span>
        </label>
        <label class="toggle" for="inventory-filter-active">
          <input type="checkbox" id="inventory-filter-active" checked>
          <span>Active</span>
        </label>
        <label class="toggle" for="inventory-filter-only-marked">
          <input type="checkbox" id="inventory-filter-only-marked">
          <span>Only Marked</span>
        </label>
        <button id="inventory-clear-filters" type="button" class="button-link secondary">Clear</button>
        <button id="inventory-package-create" type="button" class="button-link secondary hidden">Package Create</button>
      </div>

      <div id="inventory-status" class="hidden"></div>
      <div class="listing-results-table inventory-grid-wrap">
        <table>
          <thead>
            <tr>
              <th>
                <button type="button" class="inventory-sort-btn" data-sort-key="ccgNumber" aria-label="Sort by CCG number">CCG #</button>
              </th>
              <th></th>
              <th>
                <button type="button" class="inventory-sort-btn" data-sort-key="title" aria-label="Sort by title">Title</button>
              </th>
              <th>
                <button type="button" class="inventory-sort-btn" data-sort-key="paid" aria-label="Sort by paid amount">Paid</button>
              </th>
              <th>
                <button type="button" class="inventory-sort-btn" data-sort-key="private" aria-label="Sort by private party value">Private</button>
              </th>
              <th>
                <button type="button" class="inventory-sort-btn" data-sort-key="soldPrice" aria-label="Sort by sold price">Sold</button>
              </th>
              <th></th>
            </tr>
          </thead>
          <tbody id="inventory-grid-body"></tbody>
        </table>
      </div>

      <div class="inventory-grid-pager">
        <button id="inventory-page-prev" type="button" class="button-link secondary">Previous</button>
        <span id="inventory-page-label">Page 1 of 1</span>
        <button id="inventory-page-next" type="button" class="button-link secondary">Next</button>
      </div>
    </section>
  </div>

  <script type="module" src="../dist/inventory.js?version=169290"></script>
</body>
</html>
