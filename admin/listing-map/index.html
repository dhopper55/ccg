  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" sizes="180x180" href="../../images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../../images/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../images/favicon/favicon-16x16.png">
  <link rel="shortcut icon" href="../../images/favicon/favicon.ico">
  <title>Listing Map | Coal Creek Guitars</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="manifest" href="../../admin.webmanifest">
  <meta name="theme-color" content="#18150f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CCG Admin">
  <meta name="description" content="Map view of current listing evaluator results.">
  <link rel="canonical" href="https://www.coalcreekguitars.com/admin/listing-map">
  <link rel="stylesheet" href="../../styles.css?version=699338">
</head>
<body>
  <nav class="site-nav">
    <a href="../../index.html" class="nav-logo">
      <img src="../../images/coal-creek-logo.png" alt="Coal Creek Guitars">
    </a>
    <a href="/admin" class="nav-home">Admin</a>
  </nav>

  <div class="container listing-results listing-map-page">
    <header class="listing-hero">
      <div class="listing-results-header">
        <h1>Listing Map</h1>
        <div class="listing-results-actions">
          <a class="button-link secondary" href="../listing-evaluator-results.html">Results</a>
          <a class="button-link save" href="../listing-evaluator-results.html?showSaved=1" aria-label="Saved Results" title="Saved Results">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img" focusable="false" aria-hidden="true">
                <path d="M5 4h11l3 3v13H5V4zm2 2v6h10V7.8L14.2 6H7zm2 9h6v5H9v-5z" fill="currentColor"></path>
              </svg>
            </span>
          </a>
        </div>
      </div>
      <p class="subtitle">Green pins: unsaved. Blue pins: saved. Archived listings are excluded.</p>
    </header>

    <section class="listing-results-card listing-map-card">
      <div class="listing-map-topbar">
        <label class="listing-map-key-group" for="listing-map-api-key">
          <span>Google Maps API Key</span>
          <input id="listing-map-api-key" type="password" autocomplete="off" placeholder="AIza..." />
        </label>
        <button id="listing-map-load" class="button-link secondary" type="button">Load Map</button>
        <button id="listing-map-clear-key" class="button-link danger" type="button">Clear Key</button>
      </div>

      <div class="listing-map-legend">
        <span class="legend-pill legend-pill--green">Unsaved</span>
        <span class="legend-pill legend-pill--blue">Saved</span>
        <span id="listing-map-counts" class="listing-hint">Waiting for map...</span>
      </div>

      <div id="listing-map-status" class="result-section">Enter your Google Maps API key, then click Load Map.</div>
      <div id="listing-map-canvas" class="listing-map-canvas" role="region" aria-label="Listings map"></div>
    </section>
  </div>

  <footer class="site-footer">
    <div class="footer-content">
      <p class="footer-contact"><a href="../../contact-us.html">Contact Us</a> | <a href="../../privacy-policy.html">Privacy Policy</a> | <a href="../../terms-conditions.html">Terms and Conditions</a></p>
      <p class="footer-copyright">&copy; <span class="footer-year"></span> Coal Creek Guitars. All rights reserved.</p>
    </div>
  </footer>

  <script type="module" src="../../dist/listing-map.js?version=089907"></script>
  <script>
    (function() {
      const year = new Date().getFullYear();
      document.querySelectorAll('.footer-year').forEach((el) => {
        el.textContent = year;
      });
    })();
  </script>
</body>
</html>
