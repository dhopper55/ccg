<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" sizes="180x180" href="../images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon/favicon-16x16.png">
  <link rel="shortcut icon" href="../images/favicon/favicon.ico">
  <title>Inventory Item | Coal Creek Guitars</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="manifest" href="../admin.webmanifest">
  <meta name="theme-color" content="#18150f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CCG Admin">
  <link rel="stylesheet" href="../styles.css?version=402688">
</head>
<body>
  <nav class="site-nav">
    <a href="../index.html" class="nav-logo">
      <img src="../images/coal-creek-logo.png" alt="Coal Creek Guitars">
    </a>
    <a href="/admin" class="nav-home">Admin</a>
  </nav>

  <div class="container listing-evaluator inventory-manager">
    <header class="listing-hero">
      <div class="listing-hero-row">
        <h1 id="inventory-item-title">Add Inventory Item</h1>
        <div class="listing-results-actions">
          <a class="button-link secondary" href="inventory.html">Back</a>
        </div>
      </div>
    </header>

    <section class="listing-form">
      <p id="inventory-form-mode" class="listing-hint">Add mode</p>
      <form id="inventory-form">
        <div class="form-group">
          <label for="inventory-ccg">CCG Number</label>
          <input id="inventory-ccg" type="text" value="Auto-generated on save" readonly>
        </div>

        <div class="form-group">
          <label for="inventory-image-file">Image Upload</label>
          <input id="inventory-image-file" type="file" accept="image/*" multiple>
          <p class="listing-hint">Upload 1 primary image plus up to 9 additional images (10 max).</p>
          <button id="inventory-import-source" type="button" class="secondary hidden">Import Source Image</button>
          <input id="inventory-image-url" type="hidden">
          <div id="inventory-image-gallery" class="inventory-image-gallery hidden"></div>
        </div>

        <div class="form-group">
          <label for="inventory-title-input">Title</label>
          <input id="inventory-title-input" type="text" required maxlength="240" placeholder="Gibson Les Paul Standard 1996">
        </div>

        <div class="form-group">
          <label for="inventory-category">Category</label>
          <select id="inventory-category" required>
            <option value="" selected disabled>Select a category</option>
            <option value="Accessories">Accessories</option>
            <option value="Acoustic Bass">Acoustic Bass</option>
            <option value="Acoustic Guitars">Acoustic Guitars</option>
            <option value="Amplification">Amplification</option>
            <option value="Cases &amp; Bags">Cases &amp; Bags</option>
            <option value="Effects Pedals">Effects Pedals</option>
            <option value="Electric Bass">Electric Bass</option>
            <option value="Electric Guitars">Electric Guitars</option>
            <option value="Keyboards &amp; Synthesizers">Keyboards &amp; Synthesizers</option>
            <option value="Packages">Packages</option>
            <option value="Pro Audio">Pro Audio</option>
          </select>
        </div>

        <div class="form-group">
          <label for="inventory-brand">Brand</label>
          <input id="inventory-brand" type="text" maxlength="120" placeholder="Gibson">
        </div>

        <div class="form-group">
          <label for="inventory-year-range">Year Range</label>
          <input id="inventory-year-range" type="text" maxlength="120" placeholder="1996">
        </div>

        <div class="form-group">
          <label for="inventory-model">Model</label>
          <input id="inventory-model" type="text" maxlength="180" placeholder="Les Paul Standard">
        </div>

        <div class="form-group">
          <label for="inventory-finish">Finish</label>
          <input id="inventory-finish" type="text" maxlength="120" placeholder="Cherry Sunburst">
        </div>

        <div class="form-group">
          <label for="inventory-original-desc">Original Listing Desc.</label>
          <textarea id="inventory-original-desc" rows="4" maxlength="12000"></textarea>
        </div>

        <div class="form-group">
          <label for="inventory-purchased-date">Purchased Date</label>
          <input id="inventory-purchased-date" type="date" required>
        </div>

        <div class="inventory-price-row">
          <div class="form-group">
            <label for="inventory-purchase-price">How Much Paid? ($)</label>
            <input id="inventory-purchase-price" type="number" min="0" step="0.01" placeholder="0.00">
          </div>
          <div class="form-group">
            <label for="inventory-private-party-value">Private Party Value ($)</label>
            <input id="inventory-private-party-value" type="number" min="0" step="0.01" placeholder="0.00">
          </div>
        </div>

        <div class="form-group">
          <label for="inventory-purchase-notes">Purchase Notes</label>
          <textarea id="inventory-purchase-notes" rows="3" maxlength="4000"></textarea>
        </div>

        <div class="form-group inventory-bools">
          <label><input id="inventory-is-active" type="checkbox" checked> Is Active</label>
          <label><input id="inventory-is-marked" type="checkbox"> Is Marked</label>
          <label><input id="inventory-for-sale" type="checkbox"> For Sale</label>
          <label><input id="inventory-is-sold" type="checkbox"> Is Sold</label>
        </div>

        <div class="form-group">
          <label for="inventory-serial-number">Serial Number</label>
          <input id="inventory-serial-number" type="text" maxlength="180" placeholder="Optional">
        </div>

        <div class="form-group">
          <label for="inventory-sold-amount">Sold Amount</label>
          <input id="inventory-sold-amount" type="number" min="0" step="0.01" placeholder="0.00">
        </div>

        <div class="form-group">
          <label for="inventory-sell-notes">Sell Notes</label>
          <textarea id="inventory-sell-notes" rows="3" maxlength="4000"></textarea>
        </div>

        <div class="marketplace-form-actions">
          <button id="inventory-submit" type="submit">Add Inventory Item</button>
          <div id="inventory-qty-wrap" class="inventory-qty-wrap" aria-label="Batch quantity">
            <span class="inventory-qty-label">Qty</span>
            <button id="inventory-qty-minus" type="button" class="inventory-qty-btn" aria-label="Decrease quantity">-</button>
            <input id="inventory-qty" type="number" min="1" max="100" step="1" value="1" inputmode="numeric" aria-label="Quantity">
            <button id="inventory-qty-plus" type="button" class="inventory-qty-btn" aria-label="Increase quantity">+</button>
          </div>
        </div>
      </form>
      <div id="inventory-status" class="hidden"></div>
    </section>
  </div>

  <script type="module" src="../dist/inventory-item.js?version=589073"></script>
</body>
</html>
